name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PNPM_VERSION: '11.0.0' # Adjusting to 11 to match pnpm 11 gotcha mentioned
  NODE_VERSION: '20'

jobs:
  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  backend-install:
    name: backend/ installs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm install
        working-directory: backend
        run: npm install
      - name: Syntax-check every source file
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
        # backend/'s `npm test` is currently a stub that always exits 1
        # (see docs/TASK_BREAKDOWN.md) — not run in CI until it's real.
